name: Tests

# Runs the regression tests in tests/ on every pull request, so a change that
# breaks the price list, the estimate, the PDF quotation or the WhatsApp
# message shows a red cross before it can be merged.
#
# This workflow only tests. It does not build, publish or deploy anything.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Optional: test a published site (e.g. https://thecementpeople.com) instead of this branch's files"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Quotation and catalogue checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test tools
        run: pip install -r tests/requirements.txt

      - name: Install the test browser
        run: python -m playwright install --with-deps chromium

      - name: Run the tests
        env:
          TCP_SITE_URL: ${{ inputs.site_url }}
        run: python -m pytest tests -v

      - name: Keep the generated PDF quotations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-quotation-pdfs
          path: tests/output/
          if-no-files-found: ignore
          retention-days: 14

  # Phase 1: the same 41 tests, run against the Astro version in web/.
  # Builds web/ into web/dist/, serves it from a local web server on this
  # GitHub machine (Astro pages load files like /_astro/... and must be served,
  # not opened from disk), and points the tests at that server.
  # Nothing here is published or deployed.
  astro-build:
    name: Astro build (web/) - quotation and catalogue checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js (Astro 7 needs 22.23.4 or newer)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the exact Astro version recorded in package-lock.json
        working-directory: web
        run: npm ci

      - name: Check product data and build the site
        working-directory: web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test tools
        run: pip install -r tests/requirements.txt

      - name: Install the test browser
        run: python -m playwright install --with-deps chromium

      - name: Serve the built site locally
        run: |
          python -m http.server 4321 --bind 127.0.0.1 --directory web/dist > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && exit 0; sleep 1; done
          echo "Local server did not start"; cat server.log; exit 1

      - name: Run the tests against the Astro build
        env:
          TCP_SITE_URL: http://127.0.0.1:4321/
        run: python -m pytest tests -v

      - name: Keep the generated PDF quotations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-test-quotation-pdfs
          path: tests/output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the built site for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-built-site
          path: web/dist/
          if-no-files-found: ignore
          retention-days: 14
