name: Tests

# Runs the regression tests in tests/ on every pull request, so a change that
# breaks the price list, the estimate, the PDF quotation or the WhatsApp
# message shows a red cross before it can be merged.
#
# This workflow only tests. It does not build, publish or deploy anything.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Optional: test a published site (e.g. https://thecementpeople.com) instead of this branch's files"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Quotation and catalogue checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test tools
        run: pip install -r tests/requirements.txt

      - name: Install the test browser
        run: python -m playwright install --with-deps chromium

      - name: Run the tests
        env:
          TCP_SITE_URL: ${{ inputs.site_url }}
        run: python -m pytest tests -v

      - name: Keep the generated PDF quotations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-quotation-pdfs
          path: tests/output/
          if-no-files-found: ignore
          retention-days: 14
